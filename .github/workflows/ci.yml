name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # A syntactically valid but unreachable URI is enough: nothing in the build
      # or unit-test steps below opens a real Mongo connection.
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: aaspaas_ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # §2's "Supply-chain drift" mitigation. high/critical only — moderate
        # and below are frequently unfixable transitive-dev-dependency noise
        # that would make this step cry wolf and get ignored.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
