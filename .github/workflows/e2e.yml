name: E2E

# Per 07-roadmap-and-architecture.md §3's SDLC plan: "Run these on merge to
# main or nightly, not on every PR — keep CI fast." .github/workflows/ci.yml
# still gates every PR; this is the separate, slower gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_URI: mongodb://localhost:27017
      # Must end in "_e2e" — tests/e2e/global-setup.ts refuses to wipe
      # anything that doesn't, even in CI.
      MONGODB_DB_NAME: aaspaas_ci_e2e
      JWT_ACCESS_SECRET: ci-e2e-secret-do-not-use-in-real-life
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
